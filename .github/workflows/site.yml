name: Publish interface from verified data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-regional-prices-interface
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: chatgpt-regional-prices-pages
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read persisted data without starting collection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py checkout-state --state-dir data-state
      - name: Reuse the verified data version
        run: python scripts/pipeline.py prepare --mode reuse --state-dir data-state --candidate-dir work/candidate --public-dir public/data
      - run: npm run check
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Publish the interface and matching static snapshot
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
