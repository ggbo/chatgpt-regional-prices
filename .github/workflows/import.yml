name: Merge verified collection observations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import.yml
      - scripts/import_observations.py
      - tests/test_import_observations.py
  workflow_dispatch:

permissions:
  contents: read

# Imports and live collection must read and persist one data branch in order.
concurrency:
  group: chatgpt-regional-prices-production
  cancel-in-progress: false
  queue: max

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Read the immutable original observations and evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 1ddcdcd5c3befe1d6ed1dfd0e6b44abb506d5b27
          path: import-state
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Restore the latest data after acquiring the collection lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py checkout-state --state-dir data-state
      - name: Validate evidence and merge the original observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/import_observations.py
          --import-dir import-state --state-dir data-state
          --candidate-dir work/import-candidate --public-dir public/data
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: import
    runs-on: ubuntu-latest
    concurrency:
      group: chatgpt-regional-prices-pages
      cancel-in-progress: false
      queue: max
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the snapshot verified by the import build
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
