name: Refresh prices and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collection_mode:
        description: Collection mode
        type: choice
        default: retry
        options: [retry, refresh, fill]
  schedule:
    - cron: '23 * * * *'
      timezone: Asia/Shanghai
    - cron: '53 * * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: chatgpt-regional-prices-production
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
    outputs:
      continue_fill: ${{ steps.continuation.outputs.continue_initial_fill }}
    env:
      PRICE_MODE: ${{ github.event_name == 'push' && 'reuse' || github.event_name == 'workflow_dispatch' && inputs.collection_mode || github.event.schedule == '53 * * * *' && 'retry' || 'refresh' }}
      START_INITIAL_FILL: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[fill-missing]') }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore data branch or initialize local state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py checkout-state --state-dir data-state
      - name: Collect or reuse a verified snapshot
        id: prepare
        run: >-
          python scripts/pipeline.py prepare --mode "$PRICE_MODE"
          --state-dir data-state --candidate-dir work/candidate
          --public-dir public/data
      - name: Check types and price logic
        run: npm run check
      - name: Verify collector and publication rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run build
      - run: npm run verify:dist
      - name: Persist the version that passed the build
        id: persist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py persist --candidate-dir work/candidate --state-dir data-state
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Preserve attempts when collection or a later check failed
        id: accounting
        if: failure() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') && steps.persist.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py persist-collection --candidate-dir work/candidate --state-dir data-state
      - name: Continue only a persisted unfinished initial fill
        id: continuation
        if: always() && (steps.persist.outcome == 'success' || steps.accounting.outcome == 'success')
        run: python scripts/continue_fill.py --state-dir data-state
      - name: Keep short-lived failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/candidate/state/status.json
            work/candidate/state/coverage.json
            work/candidate/state/change-reviews.json
            work/candidate/collection/
            work/candidate/collection-checkpoint.json
            work/candidate/prepare-receipt.json
          retention-days: 3
          if-no-files-found: ignore

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy exactly the verified artifact
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Record deployment receipt
        env:
          DEPLOYED_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          printf 'Pages deployment succeeded: %s\nSource commit: %s\nLive manifest: %sdata/manifest.json\n' "$DEPLOYED_URL" "$GITHUB_SHA" "$DEPLOYED_URL" >> "$GITHUB_STEP_SUMMARY"

  continue-fill:
    needs: [prepare, deploy]
    if: always() && needs.prepare.outputs.continue_fill == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next failed-only fill immediately
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f collection_mode=fill
